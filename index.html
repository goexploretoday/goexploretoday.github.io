<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoExploreToday JS Library</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; line-height: 1.6; max-width: 800px; margin: auto; }
    pre { background: #f4f4f4; padding: 1rem; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>GoExploreToday JS Utilities</h1>
  <p>A lightweight JavaScript helper library for web exploration and utility functions.</p>

  <h2>Installation</h2>
  <pre><code>npm install goexploretoday-js</code></pre>

  <h2>Usage Example</h2>
  <pre><code>import { explore } from 'goexploretoday-js';
explore.init();</code></pre>

  <h2>Interactive Demo</h2>
  <button id="btn">Click to Test Utility</button>
  <p id="output"></p>

  <script>
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('output').innerText = 'JS Utility Executed Successfully!';
    });
  </script>
</body>
</html>
